<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/logo-square.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0084ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Burgood Access Control</title>
    <style>
      #preloader-container, #preloader-container * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      #preloader-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f1f3d 0%, #070c18 70%);
        z-index: 99999;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #preloader-container .logo-wrapper {
        position: relative;
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      #preloader-container .logo-pulse-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid rgba(0, 132, 255, 0.4);
        box-shadow: 0 0 25px rgba(0, 132, 255, 0.4), inset 0 0 15px rgba(0, 132, 255, 0.2);
        animation: pulse-ring 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #preloader-container .logo-pulse-ring-2 {
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        border: 1px dashed rgba(0, 212, 255, 0.25);
        animation: rotate-ring 12s linear infinite;
      }
      #preloader-container .preloader-logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 0 20px rgba(0, 132, 255, 0.6));
        animation: logo-float 3s ease-in-out infinite;
      }
      #preloader-container .brand-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        text-align: center;
        background: linear-gradient(135deg, #ffffff 40%, #8ec5fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #preloader-container .brand-title span {
        background: linear-gradient(135deg, #0084ff 0%, #00e5ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #preloader-container .brand-sub {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 28px;
        opacity: 0.95;
        text-align: center;
      }
      #preloader-container .progress-container {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 10px rgba(0, 132, 255, 0.2);
      }
      #preloader-container .progress-bar {
        position: absolute;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, transparent, #0084ff, #00f0ff, transparent);
        border-radius: 999px;
        animation: progress-slide 1.5s ease-in-out infinite;
      }
      #preloader-container .loading-text {
        margin-top: 14px;
        font-size: 13px;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.3px;
        animation: text-pulse 2s ease-in-out infinite;
      }
      @keyframes pulse-ring {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }
      @keyframes rotate-ring {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes logo-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes progress-slide {
        0% { left: -50%; }
        100% { left: 110%; }
      }
      @keyframes text-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="preloader-container">
        <div class="logo-wrapper">
          <div class="logo-pulse-ring-2"></div>
          <div class="logo-pulse-ring"></div>
          <img src="/burgood_shield.png" alt="Burgood Shield" class="preloader-logo" />
        </div>
        <h1 class="brand-title">BURGOOD <span>ACCESS</span></h1>
        <p class="brand-sub">Face ID Xavfsizlik Tizimi</p>
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <p class="loading-text">Tizim yuklanmoqda, kuting...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
